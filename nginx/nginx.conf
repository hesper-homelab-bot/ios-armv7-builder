# nginx configuration for the armv7 / iOS 10.x port.
#
# Every path below is relative to the build-time prefix /var/mobile/tools/nginx
# (configure was run with --prefix=/var/mobile/tools/nginx and the *_path
# options spelled out), and every directory it mentions is created by the
# package and left writable by the `mobile` user, so nginx runs as `mobile`
# with no root anywhere in the picture.
#
# Deliberate differences from the stock conf/nginx.conf:
#
#  * `user` is NOT set.  On iOS the process runs as mobile and nginx's setuid
#    path would only fail (mobile cannot become anyone else); leaving it out
#    keeps the master and workers as the same unprivileged user.
#  * `sendfile off`.  The build deliberately leaves NGX_HAVE_SENDFILE
#    undefined on this target (see nginx/build.sh wall #2), so nginx uses its
#    portable read/write chain regardless; saying `off` here keeps the config
#    honest instead of implying a code path that is not compiled in.
#  * listen 8080.  22 (dropbear) and 3080 (the DSH web UI) belong to other
#    services on the device; 8080 is free and unprivileged, which matters
#    because a non-root process cannot bind anything below 1024.
#  * logs/tmp/pid all live under the prefix, so one `rm -rf` of
#    /var/mobile/tools/nginx removes the whole installation.

worker_processes  1;

error_log  logs/error.log  info;
pid        logs/nginx.pid;

events {
    worker_connections  512;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log  logs/access.log;

    # no sendfile on this target -- see the header note
    sendfile        off;
    tcp_nopush      off;

    keepalive_timeout  65;

    gzip  on;
    gzip_min_length  256;
    gzip_types  text/plain text/css application/json application/javascript
                text/xml application/xml image/svg+xml;

    # Temp paths for request bodies and proxying.  --without-http_fastcgi/
    # uwsgi/scgi_module means only client_body (and proxy, if enabled) are
    # reachable; they still must exist and be writable.
    client_body_temp_path  tmp/client_body;
    proxy_temp_path        tmp/proxy;

    server {
        listen       8080;
        server_name  localhost;

        # Stock landing page, installed by the package.
        location / {
            root   share/nginx/html;
            index  index.html index.htm;
        }

        # A small always-available health endpoint: `curl localhost:8080/health`
        # answers without touching the filesystem, which makes it a clean
        # "is the server actually up" check on the device.
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        error_page  500 502 503 504  /50x.html;
        location = /50x.html {
            root  share/nginx/html;
        }
    }
}
