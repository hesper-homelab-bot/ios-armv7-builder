# sources.lock -- every upstream source this repo builds from, pinned by sha256.
#
# FORMAT (CI-enforced): pkg <TAB> version <TAB> url <TAB> sha256
#   * one row per (package, version).  Packages consumed through another
#     package's build keep their own row (zlib, openssl, curl ...) so the
#     indirect sources are recorded too.
#   * sha256 is the digest of the downloaded bytes, verified on every use by
#     tools/fetch-src.sh: a cache hit with a matching digest never touches the
#     network; a mismatch aborts the build instead of trusting the file.
#   * Cached files live in SRC_CACHE (default tmp/src-cache, gitignored --
#     never in /tmp, which is a small tmpfs on the build hosts):
#         $SRC_CACHE/<pkg>/<basename-of-url>
#   * Rolling branches with no releases (whois, class-dump, gas-preprocessor)
#     are pinned to an exact commit archive URL + digest, never "latest".
#     Every other row is version-pinned.
#   * Lines starting with # are comments; consumers/notes live there.
#
# Updating: see docs/sources-lock.md (bump version -> recompute sha256 ->
#   tools/fetch-src.sh --check).
