name: full-build (manual)
# Manual full pipeline: bootstrap the cross toolchain, smoke-compile, then
# (as the per-package build recipes are wired in) build every package, run
# the audit gate, regenerate and sign the APT repo, and publish it to
# gh-pages.  Requires repository secrets:
#   GPG_PRIVATE_KEY  -- armored secret key of the repo signing key
#                       (fingerprint 2A324C4577AB01949BEA46BC8A6DFC60F7F9E596)
#   GPG_PASSPHRASE   -- empty string (the key is unattended)
on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap the cross toolchain
        # Installed by tools/bootstrap-toolchain.sh into /opt/ios-tool;
        # stage list and verification live in that script (docs/bootstrap.md).
        run: tools/bootstrap-toolchain.sh --prefix=/opt/ios-tool
      - name: smoke -- hello.c to armv7 Mach-O, ad-hoc signed
        # The script's own stage 5: ld64 shared-object check, compile via the
        # repo's cc-wrapper, file(1) Mach-O assertion, ldid -S/-e round-trip.
        # (An earlier hand-rolled smoke here called a bare `cc` that no stage
        # ever installs -- CI run 44875204697.)
        run: tools/bootstrap-toolchain.sh --stage=5 --prefix=/opt/ios-tool --force

  build-and-publish:
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Enable each stage as its dependency lands in the repo:
    #   build-all  -- per-package build.sh invoked in topological order
    #   gate       -- tools/audit-all.sh + tools/check-undefined.sh over out/
    #   publish    -- scripts/make-repo.sh + scripts/publish-gh-pages.sh
    steps:
      - uses: actions/checkout@v4
      - name: import the repo signing key
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: build all packages (wired in stages; see tools/bootstrap-toolchain.sh progress)
        run: echo "placeholder -- build-all recipe lands with the bootstrap script"
      - name: audit gate
        run: echo "placeholder -- tools/audit-all.sh over out/"
      - name: regenerate, sign, publish
        # DANGER if run today: out/ is empty on a CI runner (no debs are built
        # yet), and make-repo.sh would happily publish an EMPTY repo over the
        # real gh-pages.  Enable this step only together with the build-all
        # step, in the same commit.
        if: false
        run: |
          set -euo pipefail
          scripts/make-repo.sh
          scripts/publish-gh-pages.sh
