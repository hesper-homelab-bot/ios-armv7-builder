name: full-build (manual)
# Manual full pipeline, one job on one runner: bootstrap the cross toolchain,
# smoke-compile, then build the canary packages (and, as recipes land, every
# package), run the audit gate, regenerate and sign the APT repo, and publish
# it to gh-pages.  One job because /opt/ios-tool is the product of the first
# stage and a second runner would not see it.
#
# Requires repository secrets:
#   GPG_PRIVATE_KEY  -- armored secret key of the repo signing key
#                       (fingerprint 2A324C4577AB01949BEA46BC8A6DFC60F7F9E596)
#   GPG_PASSPHRASE   -- empty string (the key is unattended)
on:
  workflow_dispatch:

jobs:
  bootstrap-build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # the SDK-mode contract every build.sh expects (toolchain.md section 1),
      # pointed at the bootstrap prefix; build.sh defaults to the musl sysroot
      # otherwise, and everything in CI is the SDK-mode reproduction
      IOS_SYSROOT: /opt/ios-tool/iPhoneOS10.3.sdk
      IOS_LD64: /opt/ios-tool/x-ld64/bin/x86_64-apple-darwin13.4.0-ld
      IOS_STUBDIR: /opt/ios-tool
      LD_LIBRARY_PATH: /opt/ios-tool/x-libdispatch/lib:/opt/ios-tool/x-tapi/lib
      PATH: /opt/ios-tool/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4
      - name: import the repo signing key
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: bootstrap the cross toolchain
        run: tools/bootstrap-toolchain.sh --prefix=/opt/ios-tool
      - name: smoke -- hello.c to armv7 Mach-O, ad-hoc signed
        run: tools/bootstrap-toolchain.sh --stage=5 --prefix=/opt/ios-tool --force

      - name: build canary 1 -- whois (Makefile type, zero patches)
        run: |
          set -euo pipefail
          mkdir -p tmp/src   # git checkout carries no tmp/ (gitignored)
          (cd whois && ./build.sh && ./make-deb.sh)
          tools/check-undefined.sh out/whois-*-armv7
      - name: build canary 2 -- rsync (configure + gnulib type)
        run: |
          set -euo pipefail
          (cd rsync && ./build.sh && ./make-deb.sh)
          tools/check-undefined.sh out/rsync-*-armv7
      - name: build canary 3a -- openssl (the curl dependency)
        run: |
          set -euo pipefail
          (cd openssl && ./build.sh && ./make-deb.sh)
      - name: build canary 3b -- curl (SDK + static deps + symbol audit type)
        run: |
          set -euo pipefail
          (cd curl && ./build.sh && ./make-deb.sh)
          tools/check-undefined.sh out/curl-*-armv7
      - name: audit gate
        run: |
          set -euo pipefail
          tools/audit-all.sh 2>&1 | tail -5

      - name: regenerate, sign, publish
        # DANGER if run while out/ holds only canary debs: make-repo.sh would
        # publish a partial repo over the real gh-pages.  Enable this step only
        # together with the full build-all coverage, in the same commit.
        if: false
        run: |
          set -euo pipefail
          scripts/make-repo.sh
          scripts/publish-gh-pages.sh
